<header>
  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5h-2v6l5 3 .9-1.45-3.9-2.3V7z"/></svg></span>
      <span>Doula Care</span>
    </a>
    <button class="btn menu" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav aria-label="Primary">
      <ul id="menu">
        <li><a href="index.html">Home</a></li>
<li><a href="about.html">About Me</a></li>

      </ul>
    </nav>
    <div class="nav-cta">
      <a class="btn" href="contact.html">Ask a question</a>
      <a class="btn primary" href="contact.html">Schedule a free call</a>
    </div>
  </div>
</header>

  <main>
    <section>
      <div class="container" style="max-width:var(--maxw-narrow)">
        <h1 class="title center">Do you have questions?</h1>
        <p class="subtitle center">Fill out the form and I’ll get back to you within 24 hours.</p>
        <form id="contactForm" novalidate>
          <div class="field"><label for="first">First Name</label><input id="first" name="first" required></div>
          <div class="field"><label for="last">Last Name</label><input id="last" name="last" required></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
          <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
          <div class="field"><label for="location">Birthing Location</label><input id="location" name="location" placeholder="Hospital/Birth Center/Home"></div>
          <div class="field"><label for="edd">Estimated Due Date</label><input id="edd" name="edd" type="date"></div>
          <div class="field"><label for="servicesSel">Services you’re interested in</label>
            <select id="servicesSel" name="services" multiple>
              <option>Labor & Birth Prep</option>
              <option>Birth Package</option>
              <option>Placenta Encapsulation</option>
              <option>Belly Binding</option>
              <option>Childbirth Education</option>
              <option>Newborn Classes</option>
            </select>
          </div>
          <div class="field"><label for="msg">Questions or concerns</label><textarea id="msg" name="message" rows="5" required></textarea></div>
          <button class="btn primary" type="submit">Send your message</button>
          <p id="status" class="subtitle" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>


<footer>
  <div class="container" style="display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between">
    <small>© <span id="year"></span>  c23m9</small>
    <div style="display:flex;gap:.5rem;align-items:center">
      <a class="btn" href="#top">Back to top</a>
    </div>
  </div>
</footer>

<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
